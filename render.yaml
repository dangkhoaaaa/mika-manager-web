# Render Blueprint — Web Service (Go API)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mika-manager-api
    runtime: go
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: mika_manager
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        sync: false
